services:
    gostatus:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        image: gostatus:local
        container_name: gostatus
        restart: unless-stopped

        ports:
            - "8080:8080"

        configs:
            - source: app_config
              target: /app/config.toml

        security_opt:
            - no-new-privileges:true
        read_only: true

        tmpfs:
            - /tmp:size=10M

        healthcheck:
            test: ["CMD", "/app/gostatus", "-health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

configs:
    app_config:
        file: ../config.toml
