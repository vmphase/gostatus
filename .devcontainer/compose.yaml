x-app: &app
  image: gostatus:local
  build:
    context: ..
    dockerfile: .devcontainer/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    PORT: "${PORT:-8080}"
  ports:
    - "${PORT:-8080}:${PORT:-8080}"
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=10M
  healthcheck:
    test: ["CMD-SHELL", "HEALTHCHECK=true /app/gostatus"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gostatus:
    <<: *app
    container_name: gostatus
    restart: unless-stopped
