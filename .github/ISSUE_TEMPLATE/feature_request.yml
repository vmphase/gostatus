name: Feature Request
description: Suggest a new badge type, endpoint, or improvement
labels: ["enhancement"]

body:
    - type: textarea
      id: summary
      attributes:
      label: Feature description
      description: What would you like to see added or improved?
      placeholder: "e.g. Add support for YouTube Music activity badges."
      validations:
      required: true

    - type: textarea
      id: use_case
      attributes:
      label: Use case
      description: Why would this feature be useful?
      placeholder: "I want to display the music service separately from Spotify..."

    - type: textarea
      id: proposed_solution
      attributes:
          label: Proposed solution
          description: Describe how you imagine this working, if desired
          placeholder: |
              Example endpoint:
              /badge/youtube-music/{discord_user_id}

              Optional query params:
              ?hideLogo=true

    - type: textarea
      id: alternatives
      attributes:
      label: Alternatives considered
      description: Current workaround or alternative approaches, if any

    - type: checkboxes
      id: checklist
      attributes:
      label: Checklist
      options:
          - label: I searched existing issues before creating this request.
            required: true
          - label: This feature does not already exist in the latest version.
      required: true
