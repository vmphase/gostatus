name: Lint Code

on:
    push:

jobs:
    golangci-lint:
        name: Run Linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: "go.mod"
                  cache: true
                  cache-dependency-path: "go.sum"

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9
